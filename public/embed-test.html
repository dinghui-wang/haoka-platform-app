<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iframe 嵌入测试</title>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    .bar { padding: 8px 12px; background: #4A9FF5; color: #fff; font-size: 14px; }
    iframe { border: 0; width: 100%; height: calc(100% - 36px); }
  </style>
</head>
<body>
  <div class="bar">测试页（不是 SPA）：嵌 mp.yapingkeji.com 看看是否被反嵌拦截</div>
  <iframe id="frm" src="https://m20260712.yapingkeji.com/pages/detail/index?goods_id=12023&agent_id=2355449"></iframe>
  <script>
    // 调试：捕获框架破坏（top 跳走、跨域报错等）
    document.getElementById('frm').addEventListener('load', () => {
      console.log('iframe loaded, still inside? ', window.parent === window)
    })
    window.addEventListener('beforeunload', () => {
      console.log('!!! top was navigated away — 框架破坏触发')
    })
  </script>
</body>
</html>
